<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>小組倒數計時器</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #0b1020;
      color: #f4f7ff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      --muted: #9ba8c5;
      --panel: rgba(20, 29, 52, .82);
      --line: rgba(183, 198, 233, .13);
      --accent: #7c8cff;
      --danger: #ff526b;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 80% 18%, rgba(89, 82, 191, .2), transparent 34rem),
        radial-gradient(ellipse at 12% 88%, rgba(37, 133, 177, .12), transparent 30rem),
        #0b1020;
    }

    button, input { font: inherit; }

    .app {
      width: min(1120px, 100%);
    }

    :fullscreen .app {
      width: min(1400px, 94vw);
    }

    :fullscreen .timer {
      width: min(100%, 540px);
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 24px 4px;
      color: #b8c4e1;
      font-size: .9rem;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .topline::before {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #7b8cff;
      box-shadow: 0 0 18px rgba(123, 140, 255, .9);
      content: "";
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(320px, .9fr) minmax(380px, 1.1fr);
      align-items: center;
      gap: clamp(28px, 6vw, 88px);
      padding: clamp(28px, 5vw, 64px);
      border: 1px solid var(--line);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(26, 36, 64, .94), rgba(14, 21, 40, .94));
      box-shadow: 0 32px 100px rgba(0, 0, 0, .38), inset 0 1px rgba(255, 255, 255, .035);
    }

    .controls { min-width: 0; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.2rem);
      letter-spacing: -.04em;
    }

    .intro {
      margin: 12px 0 34px;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .section-label {
      display: block;
      margin-bottom: 12px;
      color: #cbd4e9;
      font-size: .9rem;
      font-weight: 600;
    }

    .presets {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 28px;
    }

    .preset, .action {
      min-height: 48px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #e9edfa;
      background: rgba(255, 255, 255, .045);
      cursor: pointer;
      transition: background .18s ease, border-color .18s ease, transform .18s ease;
    }

    .preset:hover, .action:hover:not(:disabled) {
      border-color: rgba(150, 164, 255, .62);
      background: rgba(124, 140, 255, .13);
      transform: translateY(-1px);
    }

    .preset:focus-visible, .action:focus-visible, input:focus-visible {
      outline: 3px solid rgba(124, 140, 255, .72);
      outline-offset: 3px;
    }

    .custom-time { margin-bottom: 28px; }

    .time-inputs {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: end;
      gap: 12px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: .82rem;
    }

    .field input {
      width: 100%;
      min-width: 0;
      height: 54px;
      padding: 0 14px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: #fff;
      background: rgba(5, 10, 23, .44);
      font-size: 1.15rem;
      font-variant-numeric: tabular-nums;
    }

    .colon {
      padding-bottom: 14px;
      color: #73809e;
      font-size: 1.5rem;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .action {
      min-height: 56px;
      font-weight: 700;
    }

    .action.fullscreen {
      grid-column: 1 / -1;
      min-height: 46px;
      color: #cbd4e9;
      font-size: .9rem;
      font-weight: 600;
    }

    .action.primary {
      border-color: transparent;
      background: linear-gradient(110deg, #687cff, #8d72f8);
      box-shadow: 0 8px 24px rgba(103, 113, 255, .22);
    }

    .action.primary:hover:not(:disabled) {
      border-color: transparent;
      background: linear-gradient(110deg, #7788ff, #a081ff);
    }

    .action:disabled, .preset:disabled {
      cursor: not-allowed;
      opacity: .48;
      transform: none;
    }

    .status {
      min-height: 26px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: .9rem;
    }

    .timer-panel {
      display: grid;
      place-items: center;
      min-width: 0;
    }

    .timer {
      position: relative;
      display: grid;
      width: min(100%, 440px);
      aspect-ratio: 1;
      place-items: center;
    }

    .timer::before {
      position: absolute;
      inset: 13%;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94, 110, 255, .14), rgba(44, 54, 112, .03) 68%, transparent 70%);
      content: "";
      filter: blur(2px);
    }

    .ring {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      transform: rotate(-90deg);
    }

    .ring-track, .ring-progress {
      fill: none;
      stroke-width: 10;
    }

    .ring-track { stroke: rgba(191, 202, 235, .1); }

    .ring-progress {
      stroke: url(#ring-gradient);
      stroke-linecap: round;
      transition: stroke-dashoffset .25s linear, stroke .2s ease;
      filter: drop-shadow(0 0 10px rgba(116, 126, 255, .42));
    }

    .readout {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .time {
      font-size: clamp(4.5rem, 11vw, 7.6rem);
      font-weight: 700;
      letter-spacing: -.075em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 42px rgba(117, 130, 255, .18);
    }

    .timer-caption {
      margin-top: 16px;
      color: var(--muted);
      font-size: .85rem;
      letter-spacing: .2em;
    }

    .timer.warning .time,
    .timer.warning .timer-caption {
      color: var(--danger);
    }

    .timer.warning .ring-progress {
      stroke: var(--danger);
      filter: drop-shadow(0 0 12px rgba(255, 82, 107, .65));
    }

    .timer.warning {
      animation: warning-pulse .7s ease-in-out infinite alternate;
    }

    @keyframes warning-pulse {
      from { opacity: 1; }
      to { opacity: .48; }
    }

    @media (max-width: 760px) {
      body { padding: 22px 16px; }
      .topline { margin-bottom: 16px; }
      .layout {
        grid-template-columns: 1fr;
        gap: 28px;
        padding: clamp(22px, 6vw, 38px);
      }
      .timer-panel { grid-row: 2; }
      .timer { width: min(78vw, 360px); }
      .controls { grid-row: 1; }
      .intro { margin-bottom: 24px; }
      .presets { margin-bottom: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="topline">CLASSROOM TIMER</div>
    <section class="layout" aria-label="小組倒數計時器">
      <div class="controls">
        <h1>小組倒數計時器</h1>
        <p class="intro">設定討論時間，準備好就開始。讓每一組都能掌握節奏。</p>

        <div>
          <span class="section-label">快速設定</span>
          <div class="presets" aria-label="快速設定時間">
            <button class="preset" type="button" data-minutes="1">1 分鐘</button>
            <button class="preset" type="button" data-minutes="3">3 分鐘</button>
            <button class="preset" type="button" data-minutes="5">5 分鐘</button>
            <button class="preset" type="button" data-minutes="10">10 分鐘</button>
            <button class="preset" type="button" data-minutes="15">15 分鐘</button>
            <button class="preset" type="button" data-minutes="20">20 分鐘</button>
          </div>
        </div>

        <div class="custom-time">
          <span class="section-label">自訂時間</span>
          <div class="time-inputs">
            <div class="field">
              <label for="minutes">分鐘</label>
              <input id="minutes" type="number" min="0" max="999" step="1" value="5" inputmode="numeric">
            </div>
            <span class="colon" aria-hidden="true">:</span>
            <div class="field">
              <label for="seconds">秒數</label>
              <input id="seconds" type="number" min="0" max="59" step="1" value="0" inputmode="numeric">
            </div>
          </div>
        </div>

        <div class="actions">
          <button class="action primary" id="start-button" type="button">開始</button>
          <button class="action" id="reset-button" type="button">重設</button>
          <button class="action" id="fullscreen-button" type="button" aria-pressed="false">進入全螢幕</button>
        </div>
        <p class="status" id="status" role="status" aria-live="polite">準備就緒</p>
      </div>

      <div class="timer-panel">
        <div class="timer" id="timer">
          <svg class="ring" viewBox="0 0 300 300" role="img" aria-label="倒數進度">
            <defs>
              <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#54d6ff"></stop>
                <stop offset="52%" stop-color="#7887ff"></stop>
                <stop offset="100%" stop-color="#ba79ff"></stop>
              </linearGradient>
            </defs>
            <circle class="ring-track" cx="150" cy="150" r="136"></circle>
            <circle class="ring-progress" id="ring-progress" cx="150" cy="150" r="136"></circle>
          </svg>
          <div class="readout">
            <div class="time" id="time" aria-label="剩餘時間">05:00</div>
            <div class="timer-caption" id="timer-caption">REMAINING</div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const minutesInput = document.getElementById("minutes");
    const secondsInput = document.getElementById("seconds");
    const startButton = document.getElementById("start-button");
    const resetButton = document.getElementById("reset-button");
    const fullscreenButton = document.getElementById("fullscreen-button");
    const statusText = document.getElementById("status");
    const timeDisplay = document.getElementById("time");
    const timer = document.getElementById("timer");
    const timerCaption = document.getElementById("timer-caption");
    const ringProgress = document.getElementById("ring-progress");
    const presets = [...document.querySelectorAll(".preset")];

    const ringCircumference = 2 * Math.PI * 136;
    ringProgress.style.strokeDasharray = String(ringCircumference);

    let totalSeconds = 300;
    let remainingSeconds = totalSeconds;
    let deadline = 0;
    let countdownInterval = null;
    let alarmInterval = null;
    let isRunning = false;
    let audioContext = null;

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const remainder = seconds % 60;
      return `${String(minutes).padStart(2, "0")}:${String(remainder).padStart(2, "0")}`;
    }

    function render() {
      timeDisplay.textContent = formatTime(remainingSeconds);
      timeDisplay.setAttribute("aria-label", `剩餘時間 ${formatTime(remainingSeconds)}`);
      const progress = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
      ringProgress.style.strokeDashoffset = String(ringCircumference * (1 - progress));
      timer.classList.toggle("warning", remainingSeconds > 0 && remainingSeconds <= 10);
      timerCaption.textContent = remainingSeconds === 0 ? "TIME'S UP" : "REMAINING";
    }

    function readInputDuration() {
      const minutes = Number(minutesInput.value);
      const seconds = Number(secondsInput.value);
      if (!Number.isInteger(minutes) || minutes < 0 || minutes > 999 ||
          !Number.isInteger(seconds) || seconds < 0 || seconds > 59) {
        statusText.textContent = "請輸入有效時間（分鐘 0–999，秒數 0–59）。";
        return null;
      }
      const duration = minutes * 60 + seconds;
      if (duration === 0) {
        statusText.textContent = "請設定大於 0 秒的時間。";
        return null;
      }
      return duration;
    }

    function stopAlarm() {
      if (alarmInterval !== null) {
        window.clearInterval(alarmInterval);
        alarmInterval = null;
      }
    }

    function playAlarmTone() {
      if (!audioContext || audioContext.state !== "running") return;
      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();
      const now = audioContext.currentTime;
      oscillator.type = "sine";
      oscillator.frequency.setValueAtTime(880, now);
      oscillator.frequency.setValueAtTime(660, now + 0.22);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.22, now + 0.025);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.48);
      oscillator.connect(gain);
      gain.connect(audioContext.destination);
      oscillator.start(now);
      oscillator.stop(now + 0.5);
    }

    function finishCountdown() {
      window.clearInterval(countdownInterval);
      countdownInterval = null;
      isRunning = false;
      remainingSeconds = 0;
      startButton.textContent = "開始";
      startButton.disabled = true;
      presets.forEach(button => { button.disabled = false; });
      minutesInput.disabled = false;
      secondsInput.disabled = false;
      statusText.textContent = "時間到！";
      render();
      playAlarmTone();
      alarmInterval = window.setInterval(playAlarmTone, 800);
    }

    function tick() {
      remainingSeconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
      render();
      if (remainingSeconds === 0) finishCountdown();
    }

    function startCountdown() {
      if (isRunning) {
        remainingSeconds = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
        window.clearInterval(countdownInterval);
        countdownInterval = null;
        isRunning = false;
        startButton.textContent = "繼續";
        presets.forEach(button => { button.disabled = false; });
        minutesInput.disabled = false;
        secondsInput.disabled = false;
        statusText.textContent = "已暫停";
        render();
        return;
      }

      if (remainingSeconds === totalSeconds) {
        const inputDuration = readInputDuration();
        if (inputDuration === null) return;
        totalSeconds = inputDuration;
        remainingSeconds = inputDuration;
      }
      if (remainingSeconds <= 0) return;

      stopAlarm();
      if (!audioContext) audioContext = new AudioContext();
      audioContext.resume();
      isRunning = true;
      deadline = Date.now() + remainingSeconds * 1000;
      startButton.textContent = "暫停";
      presets.forEach(button => { button.disabled = true; });
      minutesInput.disabled = true;
      secondsInput.disabled = true;
      statusText.textContent = "倒數進行中";
      countdownInterval = window.setInterval(tick, 100);
      render();
    }

    async function toggleFullscreen() {
      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else {
          await document.documentElement.requestFullscreen();
        }
      } catch (error) {
        statusText.textContent = `無法切換全螢幕：${error.message}`;
      }
    }

    function updateFullscreenButton() {
      const isFullscreen = Boolean(document.fullscreenElement);
      fullscreenButton.textContent = isFullscreen ? "離開全螢幕" : "進入全螢幕";
      fullscreenButton.setAttribute("aria-pressed", String(isFullscreen));
    }

    function setDuration(seconds) {
      window.clearInterval(countdownInterval);
      countdownInterval = null;
      stopAlarm();
      isRunning = false;
      totalSeconds = seconds;
      remainingSeconds = seconds;
      minutesInput.value = String(Math.floor(seconds / 60));
      secondsInput.value = String(seconds % 60);
      startButton.disabled = false;
      startButton.textContent = "開始";
      presets.forEach(button => { button.disabled = false; });
      minutesInput.disabled = false;
      secondsInput.disabled = false;
      statusText.textContent = "準備就緒";
      render();
    }

    startButton.addEventListener("click", startCountdown);
    fullscreenButton.addEventListener("click", toggleFullscreen);
    document.addEventListener("fullscreenchange", updateFullscreenButton);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && isRunning) tick();
    });
    document.addEventListener("keydown", event => {
      const target = event.target;
      const isEditing = target instanceof HTMLElement &&
        (target.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName));
      if (isEditing || event.altKey || event.ctrlKey || event.metaKey || event.repeat) return;

      if (event.code === "Space") {
        event.preventDefault();
        startCountdown();
      } else if (event.key.toLowerCase() === "r") {
        event.preventDefault();
        resetButton.click();
      }
    });
    resetButton.addEventListener("click", () => {
      const inputDuration = readInputDuration();
      if (inputDuration !== null) setDuration(inputDuration);
      else {
        window.clearInterval(countdownInterval);
        countdownInterval = null;
        stopAlarm();
        isRunning = false;
        remainingSeconds = 0;
        totalSeconds = 0;
        startButton.disabled = false;
        startButton.textContent = "開始";
        presets.forEach(button => { button.disabled = false; });
        minutesInput.disabled = false;
        secondsInput.disabled = false;
        render();
      }
    });

    presets.forEach(button => {
      button.addEventListener("click", () => {
        setDuration(Number(button.dataset.minutes) * 60);
      });
    });

    function updateFromInputs() {
      if (isRunning) return;
      const inputDuration = readInputDuration();
      if (inputDuration === null) {
        startButton.disabled = true;
        totalSeconds = 0;
        remainingSeconds = 0;
        render();
        return;
      }
      stopAlarm();
      totalSeconds = inputDuration;
      remainingSeconds = inputDuration;
      startButton.disabled = false;
      startButton.textContent = "開始";
      statusText.textContent = "準備就緒";
      render();
    }

    minutesInput.addEventListener("input", updateFromInputs);
    secondsInput.addEventListener("input", updateFromInputs);

    render();
  </script>
</body>
</html>
